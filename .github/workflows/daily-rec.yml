name: daily-rec

# 每天算一次「接下来看什么」，结果提交到仓库 → 小满从 Pages 直接拉。
# 关键点：跑在 GitHub 的机器上，家里的 Mac 关不关机都不影响。
on:
  schedule:
    # 21:30 北京时间 = 13:30 UTC：晚上算好，第二天一睁眼就有
    - cron: '30 13 * * *'
    # 兜底：Actions 偶发失败/限流时，当晚 23:00 再算一遍（幂等，内容不变就不提交）
    - cron: '0 15 * * *'
  workflow_dispatch:
  # 改完代码推上来就跑一次（不碰结果文件，避免自己触发自己）
  push:
    branches: [main]
    paths-ignore:
      - 'rec.json'
      - 'tomorrow.json'
      - 'data/rec_hist.json'

permissions:
  contents: write

# 21:30 和 23:00 两次不能同时跑，否则会互相覆盖
concurrency:
  group: daily-rec
  cancel-in-progress: false

jobs:
  rec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉云端作答（私有仓库）
        env:
          ER_TOKEN: ${{ secrets.ER_TOKEN }}
        run: python3 cloud/fetch_progress.py

      - name: 算明天日程（主线 + 重点 + 看什么）
        run: python3 cloud/tomorrow.py

      - name: 算推荐清单（兼容旧的 rec.json 消费方）
        run: python3 cloud/recommend.py

      # 今天踩过的坑：带 <<<<<<< 冲突标记的文件被推上了 Pages，手机解析直接炸。
      # 产物不合法就中止，宁可保留上一次的，也不让坏数据上线。
      - name: 校验产物
        run: |
          if grep -q '^<<<<<<< ' tomorrow.json rec.json 2>/dev/null; then
            echo "::error::产物里混进了 git 冲突标记"; exit 1
          fi
          python3 -c "import json,datetime;d=json.load(open('tomorrow.json',encoding='utf-8'));want=(datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))+datetime.timedelta(days=1)).date().isoformat();assert d.get('for_date')==want,'for_date 不是明天: %r' % d.get('for_date');assert d.get('focus'),'focus 为空';print('校验通过',d['for_date'],len(d['focus']),'科')"

      - name: 提交 rec.json
        run: |
          git config user.name "er-rec-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rec.json tomorrow.json data/rec_hist.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "rec: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 跑的过程中可能有人（或上一次运行）也推了东西，抢不到就 rebase 再来
          for i in 1 2 3 4; do
            if git push origin main; then
              echo "推送成功（第 $i 次）"
              exit 0
            fi
            echo "推送被拒，rebase 后重试（$i/4）"
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 3
          done
          echo "四次都失败，放弃"; exit 1
