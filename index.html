<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="349打卡">
<meta name="theme-color" content="#07070b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>349 三科打卡</title>
<style>
:root{
  --bg:#07070b; --txt:#f5f5f7;
  --dim:rgba(235,235,245,.62); --dim2:rgba(235,235,245,.36);
  --line:rgba(255,255,255,.085); --glass:rgba(255,255,255,.055);
  --ok:#30D158; --org:#FF453A; --pharm:#FF9F0A; --ana:#0A84FF; --r:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  color:var(--txt);background:var(--bg);min-height:100vh;overscroll-behavior-y:none;
  padding:16px 16px calc(26px + env(safe-area-inset-bottom));
}
/* 极光壁纸背景 */
body::before{content:'';position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 34% at 12% 4%,rgba(109,94,252,.60),transparent 70%),
    radial-gradient(38% 30% at 92% 12%,rgba(23,195,178,.38),transparent 72%),
    radial-gradient(48% 38% at 78% 96%,rgba(255,92,122,.30),transparent 72%),
    radial-gradient(36% 28% at 6% 84%,rgba(255,198,92,.22),transparent 74%);
  filter:blur(46px) saturate(150%);
  animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.14)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 44px -16px rgba(0,0,0,.72)}
/* 顶部 */
.hero{display:flex;align-items:center;gap:15px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-34px;top:-44px;width:180px;height:180px;
  background:radial-gradient(closest-side,rgba(109,94,252,.45),transparent);pointer-events:none}
.ring{position:relative;width:80px;height:80px;flex:0 0 auto}
.ring svg{display:block;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring b i{font-style:normal;font-size:8.5px;font-weight:600;color:var(--dim2);letter-spacing:.04em;margin-top:1px}
.hd{min-width:0;flex:1}
.hd h1{font-size:17px;font-weight:800;letter-spacing:-.03em}
.hd p{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.55;font-variant-numeric:tabular-nums}
.count{text-align:right;flex:0 0 auto;position:relative}
.count strong{display:block;font-size:23px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.count span{font-size:9.5px;font-weight:600;color:var(--dim2);letter-spacing:.06em}
/* 分段控件：可左右滑动 */
.segbar{position:sticky;top:0;z-index:30;padding:6px;border-radius:18px;
  background:rgba(22,22,28,.76);border:1px solid var(--line);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.seg{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;background:transparent;color:var(--dim);
  font:600 13px/1 inherit;padding:9px 14px;border-radius:13px;white-space:nowrap;cursor:pointer;
  transition:background .22s,color .22s,transform .16s cubic-bezier(.2,.8,.2,1)}
.seg button:active{transform:scale(.94)}
.seg button.on{background:rgba(255,255,255,.17);color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 4px 12px -4px rgba(0,0,0,.7)}
/* 三科迷你网格（万能小组件那种小方块排布） */
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{position:relative;border-radius:18px;padding:12px 11px;overflow:hidden;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}
.mini::before{content:'';position:absolute;inset:0;background:var(--g);opacity:.14;pointer-events:none}
.mini .mtop{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--dim);position:relative}
.mini .mtop i{width:7px;height:7px;border-radius:50%;background:var(--g);flex:0 0 auto}
.mini .mnum{position:relative;margin-top:7px;font-size:22px;font-weight:800;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;line-height:1}
.mini .mnum em{font-style:normal;font-size:11px;font-weight:700;color:var(--dim2);margin-left:2px;letter-spacing:0}
.mbar{position:relative;height:4px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:9px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;background:var(--g);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.mini .mfoot{position:relative;margin-top:6px;font-size:10px;font-weight:600;color:var(--dim2);font-variant-numeric:tabular-nums}
/* 分组标题 */
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ghead b{font-size:14px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.ghead b i{width:8px;height:8px;border-radius:50%;background:var(--g);flex:0 0 auto}
.ghead .pill{font-size:10px;font-weight:600;color:var(--dim);background:rgba(255,255,255,.09);
  padding:3px 9px;border-radius:20px;font-variant-numeric:tabular-nums}
.ghead em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--dim2);font-variant-numeric:tabular-nums}
.sblock{margin-bottom:15px}
.sblock:last-child{margin-bottom:0}
/* 任务行 */
.task{display:flex;gap:11px;padding:12px;border-radius:18px;margin-bottom:8px;position:relative;
  overflow:hidden;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
  transition:transform .16s cubic-bezier(.2,.8,.2,1),background .22s,opacity .22s,border-color .22s}
.task:last-child{margin-bottom:0}
.task:active{transform:scale(.982)}
.task::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--g);opacity:.95}
.task.done{opacity:.46;background:rgba(48,209,88,.07);border-color:rgba(48,209,88,.22)}
.task.done .tt{text-decoration:line-through;text-decoration-color:rgba(235,235,245,.5)}
.chk{width:24px;height:24px;border-radius:50%;flex:0 0 auto;margin-top:1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:transparent;
  border:1.8px solid rgba(255,255,255,.28);background:rgba(255,255,255,.04);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background .22s,border-color .22s,color .22s}
.chk:active{transform:scale(.84)}
.task.done .chk{background:var(--g);border-color:transparent;color:#fff;
  box-shadow:0 4px 14px -3px rgba(0,0,0,.6)}
.tbody{min-width:0;flex:1}
.tline{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.tkey{font:800 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;
  color:#fff;background:rgba(255,255,255,.12);padding:4px 7px;border-radius:7px;position:relative;top:-1px}
.tt{font-size:14px;font-weight:600;line-height:1.42;letter-spacing:-.012em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;
  background:rgba(255,255,255,.09);color:var(--dim)}
.tag.b{background:rgba(255,69,58,.2);color:#FF8A80}
.tag.s{background:rgba(100,210,255,.17);color:#8FD6FF}
.min{font-size:10.5px;font-weight:600;color:var(--dim2);font-variant-numeric:tabular-nums}
.play{margin-left:auto;display:inline-flex;align-items:center;gap:4px;text-decoration:none;
  font-size:11px;font-weight:700;color:#8FD6FF;background:rgba(10,132,255,.15);
  border:1px solid rgba(10,132,255,.24);padding:5px 11px;border-radius:20px;white-space:nowrap;
  transition:transform .16s,background .2s}
.play:active{transform:scale(.93);background:rgba(10,132,255,.3)}
.note{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.55}
/* 全部日程 */
.day{border-radius:20px;margin-bottom:8px;overflow:hidden;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:background .22s,border-color .22s}
.day.now{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.22);
  box-shadow:0 12px 32px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05)}
.dhead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer}
.dnum{font-size:13px;font-weight:800;letter-spacing:-.02em;min-width:30px;font-variant-numeric:tabular-nums}
.ddate{font-size:12px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px;margin-left:2px}
.dots i{width:13px;height:5px;border-radius:3px;background:var(--g)}
.dprog{margin-left:auto;font-size:11px;font-weight:700;color:var(--dim2);font-variant-numeric:tabular-nums}
.dbody{padding:0 13px 12px}
.nowtag{font-size:9.5px;font-weight:800;color:#fff;background:var(--ok);padding:2.5px 7px;border-radius:20px;letter-spacing:.03em}
/* 路线图 */
.ph{display:flex;gap:11px;padding:12px;border-radius:18px;margin-bottom:8px;position:relative;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.ph .pdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:6px;box-shadow:0 0 12px currentColor}
.ph h4{font-size:13.5px;font-weight:700;letter-spacing:-.015em}
.ph .rng{font-size:10.5px;font-weight:700;color:var(--dim2);margin-left:8px;font-variant-numeric:tabular-nums}
.ph p{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.6}
/* 工具 */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools label{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt);
  font:700 12px/1 inherit;padding:10px 14px;border-radius:13px;cursor:pointer;
  transition:background .2s,transform .16s cubic-bezier(.2,.8,.2,1)}
.tools button:active,.tools label:active{transform:scale(.95);background:rgba(255,255,255,.16)}
.hint{font-size:11px;color:var(--dim2);line-height:1.7;margin-top:11px}
.hint code{background:rgba(255,255,255,.11);padding:1px 6px;border-radius:6px}
.empty{font-size:12.5px;color:var(--dim);padding:18px 10px;text-align:center;line-height:1.7}
/* 手机 */
@media (max-width:600px){
  body{padding:12px 11px calc(26px + env(safe-area-inset-bottom))}
  .wrap{gap:10px}
  .card{padding:14px;border-radius:22px}
  .hero{gap:12px}
  .ring,.ring svg{width:72px;height:72px}
  .ring b{font-size:15px}
  .hd h1{font-size:15.5px}
  .hd p{font-size:10px}
  .count strong{font-size:19px}
  .mrow{gap:8px}
  .mini{padding:11px 9px;border-radius:16px}
  .mini .mnum{font-size:19px}
  .seg button{padding:9px 12px;font-size:12.5px}
  .task{padding:11px 10px;border-radius:16px;gap:10px}
  .tt{font-size:13.5px}
}

</style>
</head>
<body>
<div class="wrap">
  <div class="card hero">
    <div class="ring">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" stroke="rgba(255,255,255,.12)" stroke-width="7" fill="none"></circle>
        <circle id="rg" cx="40" cy="40" r="34" stroke="url(#gd)" stroke-width="7" fill="none"
                stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"
                style="transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)"></circle>
        <defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#30D158"/><stop offset="55%" stop-color="#64D2FF"/>
          <stop offset="100%" stop-color="#BF5AF2"/></linearGradient></defs>
      </svg>
      <b id="rp">0%<i>总进度</i></b>
    </div>
    <div class="hd">
      <h1>349 三科冲刺</h1>
      <p id="sub">加载中…</p>
    </div>
    <div class="count"><strong id="cd">D-64</strong><span>距初试</span></div>
  </div>

  <div class="segbar"><div class="seg" id="tabs">
    <button data-v="today" class="on">今日</button>
    <button data-v="org">有机化学</button>
    <button data-v="pharm">药理学</button>
    <button data-v="ana">分析化学</button>
    <button data-v="all">全部日程</button>
    <button data-v="phase">路线图</button>
  </div></div>

  <div id="view"></div>

  <div class="card">
    <div class="tools">
      <button id="exp">导出进度</button>
      <label>导入备份<input type="file" id="imp" accept=".json" hidden></label>
      <button id="rst">重置</button>
    </div>
    <p class="hint">点圆圈即完成 · 进度存本机 · 落后时先跳「速通」项</p>
  </div>
</div>
<script>
const LS='t349_progress_v1';
let P=null, S=JSON.parse(localStorage.getItem(LS)||'{"done":{}}');
if(!S.done)S.done={};
const save=()=>localStorage.setItem(LS,JSON.stringify(S));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 本地日期（避免 toISOString 的 UTC 偏移导致凌晨显示前一天） */
const todayISO=()=>{const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const G={org:'linear-gradient(135deg,#FF453A,#FF375F)',
         pharm:'linear-gradient(135deg,#FF9F0A,#FFD60A)',
         ana:'linear-gradient(135deg,#0A84FF,#64D2FF)'};
const SOL={org:'#FF453A',pharm:'#FF9F0A',ana:'#0A84FF'};
const SN={org:'有机',pharm:'药理',ana:'分析'};
const SUBS=['org','pharm','ana'];
let TAB='today';

const tid=t=>t.sub+'|'+t.key+'|'+t.bvid;
function allTasks(){const a=[];P.days.forEach(d=>d.tasks.forEach(t=>a.push(t)));return a;}
function stats(){const a=allTasks();const u=[...new Set(a.map(tid))];
  const dn=u.filter(k=>S.done[k]).length;
  return {total:u.length,done:dn,pct:u.length?Math.round(dn/u.length*100):0};}
const hm=s=>Math.floor(s/60)+'h'+(s%60?String(s%60).padStart(2,'0'):'');

/* 一条任务 */
function taskHTML(t){
  const d=!!S.done[tid(t)];
  return `<div class="task ${d?'done':''}" style="--g:${G[t.sub]}">
    <div class="chk" data-act="t" data-k="${tid(t)}">✓</div>
    <div class="tbody">
      <div class="tline"><span class="tkey">${esc(t.key)}</span><span class="tt">${esc(t.title)}</span></div>
      <div class="tmeta">
        <span class="tag ${t.level==='必看'?'b':(t.level==='速通'?'s':'')}">${esc(t.level)}</span>
        <span class="tag">${esc(t.group)}</span>
        <span class="min">${esc(t.dur)}</span>
        <a class="play" href="${t.url}" target="_blank" rel="noopener">B站</a>
      </div>
      ${t.note?`<div class="note">· ${esc(t.note)}</div>`:''}
    </div></div>`;
}

/* 某科的一组任务 */
function sblock(sub,tasks){
  const dn=tasks.filter(t=>S.done[tid(t)]).length;
  const sec=tasks.reduce((s,t)=>s+t.sec,0);
  return `<div class="sblock" style="--g:${G[sub]}">
    <div class="ghead"><b style="color:${SOL[sub]}"><i></i>${SN[sub]}</b>
      <span class="pill">${tasks.length} 项 · ${hm(sec)}</span>
      <em>${dn}/${tasks.length}</em></div>
    ${tasks.map(taskHTML).join('')}</div>`;
}

/* 三科迷你方块 */
function miniRow(d){
  return `<div class="card mrow">${SUBS.map(s=>{
    const ts=d?d.tasks.filter(x=>x.sub===s):allTasks().filter(x=>x.sub===s);
    const dn=ts.filter(t=>S.done[tid(t)]).length;
    const pc=ts.length?Math.round(dn/ts.length*100):0;
    return `<div class="mini" style="--g:${G[s]}">
      <div class="mtop"><i></i>${SN[s]}</div>
      <div class="mnum">${dn}<em>/${ts.length}</em></div>
      <div class="mbar"><i style="width:${pc}%"></i></div>
      <div class="mfoot">${pc}%</div></div>`;
  }).join('')}</div>`;
}
function render(){
  const v=document.getElementById('view'), td=todayISO();
  if(TAB==='today'){
    const d=P.days.find(x=>x.date===td);
    let h=miniRow(d||null);
    if(!d){
      h+='<div class="card"><div class="empty">今天 '+td+' 不在阶段一排期内。<br>三科一轮已在 11/05 收口，接着走「路线图」。</div></div>';
    }else{
      h+='<div class="card"><div class="ghead"><b>Day '+d.day+'</b>'+
         '<span class="pill">'+d.date.slice(5).replace('-','/')+' '+d.wd+'</span>'+
         '<em>共 '+d.min+' 分钟</em></div>'+
         SUBS.map(s=>{const ts=d.tasks.filter(x=>x.sub===s);return ts.length?sblock(s,ts):'';}).join('')+
         '</div>';
    }
    v.innerHTML=h;
  }else if(TAB==='all'){
    let h='';
    P.days.forEach(d=>{
      const dn=d.tasks.filter(x=>S.done[tid(x)]).length;
      const dots=SUBS.map(s=>{
        const a=d.tasks.filter(x=>x.sub===s),ok=a.filter(x=>S.done[tid(x)]).length;
        const op=a.length?(0.28+0.72*ok/a.length):0.1;
        return '<i style="background:'+SOL[s]+';opacity:'+op.toFixed(2)+'"></i>';
      }).join('');
      h+='<div class="day'+(d.date===td?' now':'')+'"><div class="dhead" data-act="day" data-i="'+d.day+'">'+
         '<span class="dnum">D'+d.day+'</span><span class="ddate">'+d.date.slice(5).replace('-','/')+' '+d.wd+'</span>'+
         (d.date===td?'<span class="nowtag">今天</span>':'')+
         '<span class="dots">'+dots+'</span>'+
         '<span class="dprog">'+dn+'/'+d.tasks.length+'</span></div>'+
         '<div class="dbody" id="b-'+d.day+'">'+
         SUBS.map(s=>{const a=d.tasks.filter(x=>x.sub===s);return a.length?sblock(s,a):'';}).join('')+
         '</div></div>';
    });
    v.innerHTML='<div class="card">'+h+'</div>';
    v.querySelectorAll('.dbody').forEach(b=>b.style.display='none');
    const now=v.querySelector('.day.now');
    if(now){const b=now.querySelector('.dbody');if(b)b.style.display='';}
  }else if(TAB==='phase'){
    v.innerHTML='<div class="card">'+P.phases.map(p=>'<div class="ph">'+
      '<div class="pdot" style="background:'+p.color+';color:'+p.color+'"></div>'+
      '<div><h4>'+esc(p.name)+'<span class="rng">'+esc(p.range)+'</span></h4>'+
      '<p>'+esc(p.desc)+'</p></div></div>').join('')+
      '<p class="hint" style="margin-top:10px">配比：<b>'+esc(P.meta.ratio)+'</b><br>'+esc(P.meta.principle)+'</p></div>';
  }else{
    const all=allTasks().filter(x=>x.sub===TAB);
    const g={};all.forEach(x=>{(g[x.group]=g[x.group]||[]).push(x)});
    const dn=all.filter(t=>S.done[tid(t)]).length;
    let h='<div class="card" style="--g:'+G[TAB]+'">'+
      '<div class="ghead"><b style="color:'+SOL[TAB]+'"><i></i>'+SN[TAB]+'</b>'+
      '<span class="pill">'+all.length+' 项 · '+hm(all.reduce((s,x)=>s+x.sec,0))+'</span>'+
      '<em>'+dn+'/'+all.length+'</em></div>'+
      '<p class="hint" style="margin:0;font-size:10.5px">'+esc(P.meta.subjects[TAB].weight)+'</p></div>';
    Object.keys(g).forEach(k=>{
      h+='<div class="card" style="--g:'+G[TAB]+'"><div class="ghead"><b style="color:'+SOL[TAB]+'"><i></i>'+esc(k)+'</b>'+
         '<span class="pill">'+g[k].length+' 项</span></div>'+g[k].map(taskHTML).join('')+'</div>';
    });
    v.innerHTML=h;
  }
  const st=stats();
  document.getElementById('rp').innerHTML=st.pct+'%<i>总进度</i>';
  document.getElementById('rg').setAttribute('stroke-dashoffset',(213.6-213.6*st.pct/100).toFixed(1));
  const ex=new Date(P.meta.exam+'T00:00:00');
  document.getElementById('cd').textContent='D-'+Math.max(0,Math.ceil((ex-new Date())/864e5));
  document.getElementById('sub').textContent='有机 '+P.counts.org+' 讲 · 药理 '+P.counts.pharm+
    ' 个 · 分析 '+P.counts.ana+' 讲 · 已打卡 '+st.done+'/'+st.total;
}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-act="t"]');
  if(c){const k=c.dataset.k;if(S.done[k])delete S.done[k];else S.done[k]=Date.now();save();render();return;}
  const dh=e.target.closest('[data-act="day"]');
  if(dh){const b=document.getElementById('b-'+dh.dataset.i);
    if(b)b.style.display=b.style.display==='none'?'':'none';}
});
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  TAB=b.dataset.v;
  [...document.querySelectorAll('#tabs button')].forEach(x=>x.classList.toggle('on',x===b));
  b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  render();window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download='349打卡进度_'+todayISO()+'.json';a.click();
};
document.getElementById('imp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);
    if(o.done){S=o;save();render();alert('已恢复 '+Object.keys(S.done).length+' 条打卡');}}catch(_){alert('解析失败');}};
  r.readAsText(f);
};
document.getElementById('rst').onclick=()=>{if(confirm('清空打卡记录？建议先导出。')){S={done:{}};save();render();}};

fetch('plan3.json').then(r=>r.json()).then(j=>{P=j;render();}).catch(()=>{
  document.getElementById('view').innerHTML=
    '<div class="card"><div class="empty">plan3.json 未加载：请用文件夹里的「启动打卡小组件.command」打开，或确认网页已完整上传。</div></div>';
});

/* iPhone 首次访问：引导加到主屏幕 */
(function(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const sa=window.navigator.standalone===true||window.matchMedia('(display-mode:standalone)').matches;
  if(!ios||sa||localStorage.getItem('t349_hint'))return;
  const d=document.createElement('div');
  d.className='card';
  d.style.cssText='background:rgba(255,214,10,.10);border-color:rgba(255,214,10,.3)';
  d.innerHTML='<div class="ghead"><b>加到桌面</b></div>'+
    '<p class="hint" style="margin:0">点 Safari 底部「分享」→ 下滑选「添加到主屏幕」。'+
    '以后从桌面图标进，全屏无地址栏，断网也能开。</p>'+
    '<div class="tools" style="margin-top:11px"><button id="hx">知道了</button></div>';
  document.querySelector('.wrap').insertBefore(d,document.getElementById('view'));
  d.querySelector('#hx').onclick=function(){localStorage.setItem('t349_hint','1');d.remove();};
})();

/* 离线可用：网络优先，断网回落缓存 */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}


</script>
